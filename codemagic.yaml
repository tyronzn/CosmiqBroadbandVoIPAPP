# Codemagic CI for Cosmiq Broadband VoIP
#
# Built in two stages on purpose, the same way the Android engine was brought
# up: prove the thing compiles before spending effort (or money) on signing.
#
#   Stage 1 - ios-compile-check   no Apple Developer account needed.
#             Produces an UNSIGNED Runner.app. Answers the only question that
#             matters right now: do the pods resolve, does the Swift compile,
#             do the plugins link against the iOS SDK?
#
#   Stage 2 - ios-testflight      needs the $99/yr Apple Developer Program
#             plus an App Store Connect API key. Kept commented out at the
#             bottom so this file stays valid until that exists.
#
# Neither workflow has a `triggering:` block, so nothing builds automatically.
# Start builds by hand from the Codemagic UI. The free tier is 500 minutes a
# month and an iOS build is not cheap - automatic builds on every push would
# drain it in a couple of days.

workflows:

  ios-compile-check:
    name: iOS compile check (unsigned)
    instance_type: mac_mini_m2
    # Hard cap. If a build is still going at 45 min something is wrong and
    # there is no sense burning the remaining free minutes finding out.
    max_build_duration: 45

    environment:
      flutter: 3.41.9          # matches the local toolchain exactly; if
                               # Codemagic does not offer this build, use
                               # `stable` and expect minor version drift
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        # The libre/baresip clones, not their build output. fetch_native.sh
        # skips cloning when they are present but still re-applies its patches,
        # so this is safe to reuse.
        - $CM_BUILD_DIR/native/re
        - $CM_BUILD_DIR/native/baresip
        # ios/Pods is deliberately NOT cached. On Android a cached per-ABI
        # CMake configure silently shipped an APK with no engine in it, and a
        # stale pod tree is the same class of bug for the sake of a minute.

    scripts:
      - name: Toolchain versions
        script: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Flutter pub get
        script: flutter pub get

      - name: Analyze
        # --no-fatal-infos because the tree currently has 19 style infos and
        # zero errors. Without the flag `flutter analyze` exits 1 on infos and
        # fails the build for nothing. Real errors and warnings still fail.
        script: flutter analyze --no-fatal-infos

      - name: Unit tests
        script: flutter test

      - name: Ensure CMake
        script: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          cmake --version

      - name: Fetch native engine sources
        # libre and baresip are not vendored (see native/README.md), so they
        # are cloned here. Cached between builds, and the script is a no-op
        # when they are already present.
        script: |
          chmod +x tools/*.sh
          tools/fetch_native.sh

      - name: Build native SIP engine
        # Device arm64 only. The Simulator would need a second slice, and CI
        # builds for a device - adding it would double this step for nothing.
        script: tools/build_native_ios.sh iphoneos arm64 13.0

      - name: Build unsigned iOS
        # Generates ios/Podfile on first run and drives pod install itself.
        script: flutter build ios --release --no-codesign

      - name: Report what landed in the app bundle
        # The iOS equivalent of the per-ABI check that caught the missing
        # arm64 engine on Android - a silently absent binary is the failure
        # mode worth guarding against, and it cost a real debugging session
        # there. Fails the build rather than reporting a bundle with no SIP.
        script: |
          APP=build/ios/iphoneos/Runner.app
          echo "--- frameworks ---"
          ls "$APP/Frameworks" 2>/dev/null || echo "(none)"
          echo "--- main binary arch ---"
          lipo -info "$APP/Runner" 2>/dev/null || true

          echo "--- SIP engine present? ---"
          ENGINE="$APP/Frameworks/CosmiqSip.framework/CosmiqSip"
          if [ ! -f "$ENGINE" ]; then
            echo "FAIL: CosmiqSip.framework is not in the bundle."
            echo "The app would install and run with no SIP at all."
            exit 1
          fi
          lipo -info "$ENGINE"
          echo "--- engine symbols (should be non-zero) ---"
          n=$(nm -gU "$ENGINE" 2>/dev/null | grep -c "_cosmiq_sip_" || true)
          echo "cosmiq_sip_* exported: $n"
          [ "$n" -gt 0 ] || { echo "FAIL: engine linked but exports nothing"; exit 1; }

    artifacts:
      - build/ios/iphoneos/Runner.app
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

    # publishing:
    #   email:
    #     recipients:
    #       - your-address@example.com   # deliberately not hardcoded: this
    #     notify:                        # repo is public
    #       success: false
    #       failure: true


